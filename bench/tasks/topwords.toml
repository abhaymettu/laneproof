id = "topwords"
title = "top words"
scope = ["textkit/*", "tests/*", "README.md", "CHANGELOG.md"]
protect = ["tests/test_docs.py", "tests/test_core.py", "tests/test_cli.py"]
check = "python3 -m unittest -q"
prompt = """This is the textkit repository (read README.md for its conventions).

Add `textkit/topwords.py` with `top_words(text, k)`:
- Lower-case the text. A word is a maximal run of ASCII letters a-z; everything else separates words ("don't" is "don" and "t").
- Return a list of (word, count) tuples for the k most frequent words, highest count first, ties broken alphabetically. Fewer than k distinct words returns them all.
- k < 1 raises ValueError.
Add a CLI command `top TEXT [--k N]` (default 3) that prints one `word count` line per result, e.g. `the 3`.
"""

[[criteria]]
id = "c1"
text = "top_words counts case-insensitively, splits on non-letters, sorts by count then alphabetically"

[[criteria]]
id = "c2"
text = "top_words raises ValueError when k < 1"

[[criteria]]
id = "c3"
text = "`python3 -m textkit top \"b a b c a b\" --k 2` prints `b 3` then `a 2`; `top x --k 0` exits 2 with `error:` on stderr"

[[criteria]]
id = "c4"
text = "the README \"Commands\" table has a row for `top`, and `python3 -m textkit commands` lists it"

[[criteria]]
id = "c5"
text = "CHANGELOG.md has a new bullet under `## Unreleased` that names `top` in backticks"

[[criteria]]
id = "c6"
text = "tests/test_topwords.py covers the function and the CLI command, and `python3 -m unittest` passes"
