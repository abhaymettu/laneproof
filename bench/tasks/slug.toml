id = "slug"
title = "slugify"
scope = ["textkit/*", "tests/*", "README.md", "CHANGELOG.md"]
protect = ["tests/test_docs.py", "tests/test_core.py", "tests/test_cli.py"]
check = "python3 -m unittest -q"
prompt = """This is the textkit repository (read README.md for its conventions).

Add `textkit/slug.py` with `slugify(text, sep="-")`:
- Normalize with unicodedata NFKD and drop every non-ASCII character (so "é" becomes "e").
- Lower-case the result.
- Every run of characters that are not a-z or 0-9 becomes a single `sep`.
- No leading or trailing `sep`.
- If nothing is left (for example "!!!" or ""), raise ValueError.
Examples: slugify("Héllo, Wörld!") == "hello-world"; slugify("  C++ & Rust  ") == "c-rust"; slugify("a b", sep="_") == "a_b".
Add a CLI command `slug TEXT [--sep SEP]` that prints the slug.
"""

[[criteria]]
id = "c1"
text = "slugify behaves exactly as specified, including accents, runs of separators, --sep and the examples"

[[criteria]]
id = "c2"
text = "slugify raises ValueError when nothing is left (e.g. \"!!!\")"

[[criteria]]
id = "c3"
text = "`python3 -m textkit slug \"H\u00e9llo, W\u00f6rld!\"` prints hello-world; `slug \"a b\" --sep _` prints a_b; `slug \"!!!\"` exits 2 with `error:` on stderr"

[[criteria]]
id = "c4"
text = "the README \"Commands\" table has a row for `slug`, and `python3 -m textkit commands` lists it"

[[criteria]]
id = "c5"
text = "CHANGELOG.md has a new bullet under `## Unreleased` that names `slug` in backticks"

[[criteria]]
id = "c6"
text = "tests/test_slug.py covers the function and the CLI command, and `python3 -m unittest` passes"
